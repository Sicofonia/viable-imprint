tasks:
  - name: cleanup
    engine: llm_text
    prompt: prompts/s1b/cleanup_task.txt
    output: cleaned
    manifest_key: cleaned
    # No explicit max_chars, deliberately (ADR 017's 2026-09-11 correction
    # briefly set this to a static 100000, superseded here by ADR 018's
    # provider-aware default): this task's real chunk size should follow
    # whichever provider/model is configured, not a value only ever
    # validated against one of them. engines/llm_text.py's
    # _resolve_default_max_chars() computes ~229,376 for the currently
    # configured Google AI Studio model (config.yaml's llm.limits), or
    # falls back to the legacy, Mistral-proven 8000 if that provider is
    # selected instead — see docs/adr/018-provider-aware-chunk-sizing.md.

  - name: translate
    engine: translation
    output: translated

  - name: ortho
    engine: llm_text
    prompt: prompts/s1b/ortho_task.txt
    # Same reasoning as cleanup above.

  - name: copyedit
    engine: llm_text
    prompt: prompts/s1b/copyedit_task.txt
    # Same reasoning as cleanup above.

  - name: format
    engine: odt_format
    output: formatted
    style_config: templates/format_styles.yaml
