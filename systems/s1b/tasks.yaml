tasks:
  - name: cleanup
    engine: llm_text
    prompt: prompts/s1b/cleanup_task.txt
    output: cleaned
    manifest_key: cleaned
    # No explicit max_chars, deliberately (ADR 017's 2026-09-11 correction
    # briefly set this to a static 100000, superseded here by ADR 018's
    # provider-aware default): this task's real chunk size should follow
    # whichever provider/model is configured, not a value only ever
    # validated against one of them. engines/llm_text.py's
    # _resolve_default_max_chars() computes ~229,376 for the currently
    # configured Google AI Studio model (config.yaml's llm.limits), or
    # falls back to the legacy, Mistral-proven 8000 if that provider is
    # selected instead — see docs/adr/018-provider-aware-chunk-sizing.md.
    #
    # min_output_ratio (see ortho below): since ADR 025 the OCR clean-up work
    # that used to shrink this stage's text (page numbers, running headers,
    # line breaks) is done by `s1b prepass` before it, so cleanup is a
    # near-1:1 pass again and a reply under 90% of the input means text was
    # dropped. Run on a raw, un-pre-passed source the page apparatus alone can
    # make a chunk legitimately shrink a few percent, which 0.9 still allows.
    min_output_ratio: 0.9

  - name: translate
    engine: translation
    output: translated

  - name: ortho
    engine: llm_text
    prompt: prompts/s1b/ortho_task.txt
    # Same reasoning as cleanup above.
    # min_output_ratio: output must be at least this fraction of the input
    # chunk's length, else the chunk is retried once and then the task fails
    # (engines/llm_text.py _complete_chunk). Added after a copyedit run silently
    # dropped a whole 27-paragraph chunk; ortho and copyedit only substitute
    # within paragraphs, so a large shrink always means lost text.
    min_output_ratio: 0.85

  - name: copyedit
    engine: llm_text
    prompt: prompts/s1b/copyedit_task.txt
    # Same reasoning as cleanup above.
    min_output_ratio: 0.85   # see ortho above

  - name: format
    engine: odt_format
    output: formatted
    style_config: templates/format_styles.yaml
