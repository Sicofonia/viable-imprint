# API keys are loaded from .env (MISTRAL_API_KEY, GOOGLE_AISTUDIO_API_KEY,
# DEEPL_API_KEY). This file contains only non-secret settings and is safe
# to commit.

llm:
  # Three providers are supported: "z-ai" (this project's default, ADR 021),
  # "google-aistudio" (ADR 017) and "mistral". Z.ai and Mistral both speak
  # OpenAI-style chat completions and share one retry/backoff loop
  # (providers/llm/openai_chat.py); Gemini's generateContent is a different
  # wire format and keeps its own self-contained file. Every key below is
  # read once for the whole pipeline — there is no per-task or per-book
  # provider override. Keys specific to one provider are ignored by the
  # others; switching providers means swapping the whole block (a complete
  # Google AI Studio block is kept, commented out, further down).
  provider: z-ai
  # Required for every provider — there is no provider-agnostic default (a
  # model name sent to the wrong provider just fails). glm-4.7-flash is free
  # on Z.ai's pricing page and confirmed working against api.z.ai; ADR 021's
  # original glm-4-flash does not exist there ("1211 Unknown Model" — it is
  # a Zhipu China-platform model). mistral-medium-latest for Mistral.
  model: glm-4.7-flash
  # 0.0 = most deterministic / least creative. Recommended for editorial tasks
  # (cleanup, ortho, copyedit) where fidelity to the source text matters more
  # than fluency. Raise it only if output feels too rigid.
  temperature: 0.0
  # Z.ai only. GLM 4.5+ models reason by default, returned separately from
  # the reply and billed/timed as output — "disabled" (the default) turns it
  # off for this pipeline's transformation tasks; "enabled" turns it back
  # on. See docs/adr/021-zai-glm4-flash-provider.md.
  thinking: disabled
  # Z.ai and Mistral (Mistral: unset = off; Z.ai: unset = 1.0). Minimum gap enforced between the start of one chunk's request
  # and the next — proactive, unlike everything else about the retry loop,
  # which only reacts once a 429 has already happened. Confirmed useful on a
  # real 29-chunk run that got three 429s, evenly spread, each recovered by
  # the retry loop's own next attempt — this doesn't replace that loop, it
  # aims to make hitting it less frequent. 1.0 is a guess, not derived from a
  # confirmed per-second ceiling (see docs/adr/021-zai-glm4-flash-provider.md);
  # 0 disables it entirely, restoring the original back-to-back behavior.
  request_pacing_seconds: 1.0
  # Optional — docs/adr/021-zai-glm4-flash-provider.md, Decision 5. For
  # Z.ai (built-in 6000) and Mistral (built-in 8000), the default chunk size for any llm_text task that sets no
  # max_chars of its own in tasks.yaml (an explicit task-level max_chars
  # always wins outright). Omit it to use the built-in value. A conservative
  # first value, not derived from a confirmed limit: the "over 8K context ->
  # throttled" figure it was first reasoned from belongs to GLM-4-Flash on
  # Zhipu's China platform, not glm-4.7-flash. Raise it once real runs show
  # response times on full-size chunks. (Google AI Studio uses
  # limits.max_output_tokens instead — see the alternative block below.)
  limits:
    max_context_chars: 6000
  # Optional — System 3's `s3 dashboard` (ADR 005) uses this to turn captured
  # token counts into a cost figure. Omit it to skip cost calculation. Z.ai
  # lists glm-4.7-flash as free, so this is a real 0, not the *shadow* paid
  # rate recorded for Google AI Studio's free tier — there is no known paid
  # rate to shadow (ADR 021, Decision 6). Re-check if Z.ai's terms change.
  pricing:
    prompt_per_million: 0.0
    completion_per_million: 0.0

  # ---- Alternative: Google AI Studio (ADR 017/018/020) -------------------
  # To switch, replace the keys above with these (uncommented), and set
  # GOOGLE_AISTUDIO_API_KEY in .env.
  # provider: google-aistudio
  # There is no provider-agnostic default model name (a Mistral model name
  # sent to Google AI Studio, or vice versa, would just fail) — this key is
  # required regardless of which provider is selected. gemini-3.6-flash for
  # Google AI Studio, pinned rather than the floating gemini-flash-latest
  # alias so manifest.yaml records real, stable provenance for a published
  # book; mistral-medium-latest for Mistral. Applies to every task — no
  # per-task model override exists yet (unlike temperature/max_chars, see
  # tasks.yaml).
  # model: gemini-3.6-flash
  # 0.0 = most deterministic / least creative. Recommended for editorial tasks
  # (cleanup, ortho, copyedit) where fidelity to the source text matters more
  # than fluency. Raise it only if output feels too rigid. Left at 0.0 for
  # Gemini deliberately, not evaluated against it yet — see the ADR.
  # temperature: 0.0
  # Google AI Studio (Gemini 3) only, ignored by Mistral. "low"/"medium"/
  # "high" — thinking is on by default for Gemini 3 models and cannot be
  # disabled entirely; thinking tokens are billed as output tokens. "low"
  # minimizes that cost for this pipeline's transformation/expansion tasks,
  # which are not the kind of problem-solving thinking helps with. Omit
  # this key to let the model's own default ("medium") apply.
  # thinking_level: low
  # Optional — docs/adr/020-google-aistudio-model-fallback.md. Google AI
  # Studio only (ignored by Mistral). Models tried, in order, when the
  # current model keeps returning 503 UNAVAILABLE ("high demand") for
  # fallback_after_seconds (default 60). Only 503s trigger a switch — never
  # timeouts, 429s or content-filter failures. Once switched, a run stays on
  # the fallback until it ends; the next task run starts from `model` again.
  # The manifest ledger records the model(s) that actually ran (`model`,
  # plus `models_used` after a switch). Omit to keep no-fallback behavior.
  # Cautions, all user-maintained like pricing/limits below: every entry must
  # be a Gemini 3-family model accepting the same thinking_level, with an
  # output-token ceiling at least llm.limits.max_output_tokens (chunks are
  # sized for the primary); "similar performance" is your judgement, and
  # cost_usd stays computed from the single pricing block below, so it is
  # approximate after a switch. Model names go stale — re-check them.
  # fallback_models:
  #   - gemini-3.7-flash
  #   - gemini-3.5-flash
  # fallback_after_seconds: 60
  # Optional — System 3's `s3 dashboard` (ADR 005) uses this to turn captured
  # token counts into a cost figure. Omit this block entirely to skip cost
  # calculation; duration and token counts are captured either way. Prices
  # change over time and by account tier — these are illustrative placeholders
  # only, not verified current figures. Confirm against your own account/plan
  # before trusting the dashboard's cost column. Note: while running on a
  # free tier (Google AI Studio's, at current volumes), this is a *shadow*
  # cost — what the run would have cost if billed, not what was actually
  # charged — so the dashboard still shows meaningful exposure to the
  # dependency instead of a uniformly misleading $0.00. These figures are
  # also promotional and double on 1 January 2027 (to $1.50 / $7.50) — a
  # known, dated change, not a placeholder to eventually verify.
  # pricing:
  #   prompt_per_million: 0.75
  #   completion_per_million: 3.75
  # Optional — docs/adr/018-provider-aware-chunk-sizing.md. Used to derive a
  # safe default max_chars for any llm_text task that does not set its own
  # in tasks.yaml (an explicit task-level max_chars always wins outright —
  # this only ever fills in for a task that specified nothing). Omit this
  # block to fall back to the pre-ADR-018 default (8000 chars) — same
  # opt-in shape as pricing above, and the same caution applies: this is a
  # property of the currently configured model, not the account, and goes
  # stale on a model swap. 65536 is gemini-3.6-flash's real output-token
  # ceiling, confirmed 2026-09-11 against Google DeepMind's own model card
  # (ai.google.dev / deepmind.google), not assumed from a blog post — see
  # the ADR's Decision 1 for why this lives in config rather than a
  # hardcoded constant.
  # limits:
  #   max_output_tokens: 65536

translation:
  provider: etranslation          # or: deepl
  source_lang: EN
  target_lang: ES

  # ADR 022 — European Commission eTranslation. Needs three keys in .env
  # (ETRANSLATION_APP_NAME, ETRANSLATION_PASSWORD, ETRANSLATION_RECEIVER_SECRET)
  # and the receiver deployed first: receivers/etranslation-vercel/README.md.
  etranslation:
    # The deployed receiver's URL. https, no query string.
    receiver_url: https://your-project.vercel.app/api/etranslation
    domain: GEN                   # "General text"; the Commission's GET /getDomains lists the rest
    document_format: html         # html | txt — html carries [i]/[sc] as inline tags; txt is sent as-is
    # true / false / null. false is sent explicitly so a change to the account's
    # server-side default cannot silently change the output; null omits the llm
    # block entirely (needed if the account is not allowed to use LLM enhancement).
    llm_enhanced: false
    # Both are guesses, not measured turnaround times — revisit after a real book.
    poll_interval_seconds: 30
    timeout_minutes: 120
    # Free for eligible SMEs: a real figure, not a shadow price.
    pricing:
      per_million_characters: 0.0

  # Pricing lives under each provider, so switching providers cannot leave
  # another provider's rate on the dashboard (ADR 022, Decision 5). Optional,
  # same caveat as llm.pricing above — DeepL's API pricing is per character;
  # confirm your own plan's current rate before trusting it. A legacy
  # top-level `translation.pricing:` block is still read, but only for deepl.
  deepl:
    pricing:
      per_million_characters: 20.00

s3:
  # Optional — System 3's `s3 dashboard` (ADR 010) uses this to flag
  # portfolio outliers. Omit either field, or the whole block, to skip that
  # flagging entirely; the dashboard still shows every number either way.
  # Both are peer-comparison multipliers against the current portfolio's own
  # average, not a budget: "this book/task costs N times more than the rest
  # of the portfolio typically does," nothing more.
  deviation:
    cost_multiplier: 3.0
    duration_multiplier: 3.0

books_dir: books

# Root folder for System 4 (Strategic Intelligence) — not book-scoped, so it
# lives outside books_dir. Structured like a book internally (its own
# manifest.yaml, s4/ subfolder) — see docs/adr/003-system-4-strategic-intelligence.md.
intelligence_dir: intelligence

# Root folder for candidates under System 5 policy evaluation (ADR 006) — not
# book-scoped either, same reasoning as intelligence_dir: a text under
# evaluation has no editorial commitment behind it yet, so it doesn't belong
# under books_dir.
candidates_dir: candidates

# Root folder for System 5's homeostat pipeline (ADR 007) — the S3/S4
# confrontation dashboard. Not book-scoped, same reasoning as intelligence_dir
# and candidates_dir.
homeostat_dir: homeostat

# Root folder for System 1D's monthly newsletter pipeline (ADR 008) — not
# book-scoped either: calendar-driven and catalog-wide, same reasoning as
# intelligence_dir/candidates_dir/homeostat_dir.
newsletter_dir: newsletter
